# 워크플로우 이름 (GitHub 화면에 표시)
name: CI

# 언제 실행할지
on:
  push:                # push할 때
    branches: [ main, develop ]
  pull_request:        # PR 올릴 때
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest      # 우분투 임시 컴퓨터에서 실행

    steps:
      # 1. 코드를 임시 컴퓨터로 내려받기
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      # 2. JDK 17 설치 (KOK이 Java 17)
      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. gradlew 실행 권한 부여 (리눅스에서 필요)
      - name: gradlew 권한
        run: chmod +x ./gradlew

      # 4. 빌드 + 테스트
      - name: 빌드 및 테스트
        run: ./gradlew build