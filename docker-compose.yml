services:
  eureka-server:
    build:
      context: ./infrastructure/eureka-server
    container_name: kok-eureka-server
    ports:
      - "${EUREKA_PORT}:8761"
    networks:
      - kok-network

  postgres:
    image: postgres:16
    container_name: kok-postgres
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - kok-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - kok-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: kok-redis
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - kok-network

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: kok-redis-exporter
    ports:
      - "${REDIS_EXPORTER_PORT:-9121}:9121"
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      - redis
    networks:
      - kok-network

  kafka:
    image: apache/kafka:4.1.1
    container_name: kok-kafka
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kok-kafka-data:/var/lib/kafka/data
    networks:
      - kok-network

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: kok-kafka-exporter
    command:
      - "--kafka.server=kafka:29092"
    ports:
      - "${KAFKA_EXPORTER_PORT:-9308}:9308"
    depends_on:
      - kafka
    networks:
      - kok-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kok-kafka-ui
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: kok-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - kok-network

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: kok-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - kok-prometheus-data:/prometheus
    networks:
      - kok-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  zipkin:
    image: openzipkin/zipkin:3
    container_name: kok-zipkin
    ports:
      - "${ZIPKIN_PORT:-9411}:9411"
    networks:
      - kok-network

  loki:
    image: grafana/loki:3.5.0
    container_name: kok-loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/local-config.yaml
    networks:
      - kok-network

  promtail:
    image: grafana/promtail:3.5.0
    container_name: kok-promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./docker/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - kok-network

  grafana:
    image: grafana/grafana:11.0.0
    container_name: kok-grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - kok-grafana-data:/var/lib/grafana
    depends_on:
      - loki
      - prometheus
    networks:
      - kok-network

networks:
  kok-network:
    driver: bridge

volumes:
  kok-postgres-data:
  kok-kafka-data:
  kok-prometheus-data:
  kok-grafana-data:
