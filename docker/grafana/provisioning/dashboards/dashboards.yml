# 이 폴더의 대시보드 JSON을 Grafana 기동 시 자동 로드
apiVersion: 1

providers:
  - name: store-service
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
