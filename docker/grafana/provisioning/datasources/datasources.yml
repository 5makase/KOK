# Grafana datasource 자동 등록
apiVersion: 1

datasources:
  # Loki 로그 조회
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true

  # Prometheus 메트릭 조회
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
