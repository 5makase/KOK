server:
  port: ${AI_OPS_ASSISTANT_PORT:8099}

spring:
  application:
    name: ai-ops-assistant
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-3.5-flash

prometheus:
  base-url: ${PROMETHEUS_BASE_URL:http://localhost:9090}
  connect-timeout-ms: 1000
  read-timeout-ms: 5000

slack:
  bot-token: ${SLACK_BOT_TOKEN}
  alert-channel-id: ${SLACK_ALERT_CHANNEL_ID}
  connect-timeout-ms: 1000
  read-timeout-ms: 3000

ai-ops:
  api-key: ${AI_OPS_API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,info
