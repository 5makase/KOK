server:
  port: ${API_GATEWAY_PORT:8000}

spring:
  application:
    name: api-gateway

  main:
    web-application-type: reactive

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**, /api/v1/auth/**, /api/v1/owners/**
              filters:
                - name: JwtAuthenticationFilter

            - id: store-service
              uri: lb://store-service
              predicates:
                - Path=/api/v1/stores/**, /api/v1/categories/**
              filters:
                - name: JwtAuthenticationFilter

            - id: store-service-admin
              uri: lb://store-service
              predicates:
                - Path=/api/v1/admin/stores/**, /api/v1/admin/categories/**
              filters:
                - name: JwtAuthenticationFilter

            - id: reservation-service
              uri: lb://reservation-service
              predicates:
                - Path=/api/v1/reservations/**
              filters:
                - name: JwtAuthenticationFilter

            - id: slot-service
              uri: lb://reservation-service
              predicates:
                - Path=/api/v1/slots/**
              filters:
                - name: JwtAuthenticationFilter

            - id: waiting-service
              uri: lb://waiting-service
              predicates:
                - Path=/api/v1/waitings/**
              filters:
                - name: JwtAuthenticationFilter

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/notifications/**
              filters:
                - name: JwtAuthenticationFilter

            - id: review-service
              uri: lb://review-service
              predicates:
                - Path=/api/v1/reviews/**
              filters:
                - name: JwtAuthenticationFilter

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/v1/payments/**
              filters:
                - name: JwtAuthenticationFilter

jwt:
  secret: ${JWT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info