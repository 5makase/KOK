server:
  port: ${REVIEW_SERVICE_PORT:8006}

spring:
  application:
    name: review-service

  datasource:
    url: ${REVIEW_DB_URL:jdbc:postgresql://localhost:5433/review_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: review-service-group
      auto-offset-reset: earliest          # 리스너 기동 전 발행분도 받도록
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
    properties:
      spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
      spring.json.value.default.type: com.kok.review.infrastructure.messaging.dto.ReservationEvent
      spring.json.use.type.headers: false
      spring.json.trusted.packages: "com.kok.review.infrastructure.messaging.dto"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics   # prometheus/metrics는 다음 단계 대비(있어도 무방)
  metrics:
    tags:
      application: review-service
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0                              # 모든 요청 추적 (개발용)
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}   # Zipkin 주소

feign:
  circuitbreaker:
    enabled: true
  client:
    config:
      default:
        connect-timeout: 1000    # 연결 수립 대기: 1초
        read-timeout: 2000       # 응답 대기: 2초 (트랜잭션 내 커넥션 점유 상한)
      store-service:              # @FeignClient(name = "store-client") 와 일치
        connect-timeout: 1000
        read-timeout: 2000

resilience4j:
  circuitbreaker:
    instances:
      store-service:
        register-health-indicator: true          # actuator health에 서킷 상태 노출
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10                   # 최근 10건 기준으로 실패율 판단
        minimum-number-of-calls: 5                # 최소 5건은 쌓여야 판단 시작 (초기 오탐 방지)
        failure-rate-threshold: 50                # 실패율 50% 넘으면 OPEN
        wait-duration-in-open-state: 10s          # OPEN 유지 10초 후 HALF_OPEN
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true