server:
  port: ${REVIEW_SERVICE_PORT:8006}

spring:
  application:
    name: review-service

  datasource:
    url: ${REVIEW_DB_URL:jdbc:postgresql://localhost:5433/review_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: review-service-group
      auto-offset-reset: earliest          # 리스너 기동 전 발행분도 받도록
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
    properties:
      spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
      spring.json.value.default.type: com.kok.review.infrastructure.messaging.dto.ReservationEvent
      spring.json.use.type.headers: false
      spring.json.trusted.packages: "com.kok.review.infrastructure.messaging.dto"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics   # prometheus/metrics는 다음 단계 대비(있어도 무방)
  tracing:
    sampling:
      probability: 1.0                              # 모든 요청 추적 (개발용)
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}   # Zipkin 주소