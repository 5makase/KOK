server:
  port: ${WAITING_SERVICE_PORT:8004}

spring:
  application:
    name: waiting-service

  datasource:
    url: ${WAITING_DB_URL:jdbc:postgresql://localhost:5433/waiting_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

waiting:
  kafka:
    topic:
      waiting-events:
        name: ${WAITING_EVENTS_TOPIC:waiting.events.v1}
        partitions: ${WAITING_EVENTS_TOPIC_PARTITIONS:1}
        replicas: ${WAITING_EVENTS_TOPIC_REPLICAS:1}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
